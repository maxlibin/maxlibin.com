[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/side-project-to-glory"
  to = "/vibe-code-to-glory"
  status = 301
  force = true

# Serve the sitemap at the conventional /sitemap.xml path crawlers default to.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

# The fish tank is deployed as its own Netlify site (github.com/maxlibin/threejs-fish-tank),
# built with base "/living-room-fish-tank/", so its 349 MB of assets stay out of this repo.
[[redirects]]
  from = "/living-room-fish-tank/*"
  to = "https://living-room-fish-tank.netlify.app/:splat"
  status = 200
  force = true

# RFC 8288 Link headers for agent discovery + content-negotiation hints.
[[headers]]
  for = "/*"
  [headers.values]
    Link = '</llms.txt>; rel="describedby"; type="text/markdown", </sitemap-index.xml>; rel="sitemap"'
    Vary = "Accept"
